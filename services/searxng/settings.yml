use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET_KEY:-default_secret_key}"
  limiter: false

redis:
  url: "${SEARXNG_REDIS_URL:-redis://redis:6379/0}"

search:
  formats:
    - json
  safe_search: 0
  default_lang: en
  # Never suspend engines — retry immediately (useful with rotating proxies)
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    cf_SearxEngineCaptcha: 0
    cf_SearxEngineAccessDenied: 0
    recaptcha_SearxEngineCaptcha: 0
  ban_time_on_fail: 0
  max_ban_time_on_fail: 0

outgoing:
  request_timeout: 15.0
  max_request_timeout: 20.0
  enable_http2: false
  # Google /sorry/-blocks a fraction of the rotating residential exit IPs.
  # google_sorry_fix.py turns a 302/sorry into an immediate-retry captcha
  # (suspended_times: 0 below), so each retry rotates to a fresh IP. With the
  # US-geo pool ~2/3 of IPs are clean, so 4 attempts (retries: 3) ≈ 99% hit a
  # working IP. Do NOT set source_ips here — binding the local socket while
  # proxying is pointless (the exit IP is the proxy's) and degrades requests.
  retries: 3
  pool_connections: 20
  # Keep-alive ON (pool_maxsize>0). Tested pool_maxsize:0 to force per-retry IP
  # rotation past burned IPs, but establishing a fresh residential tunnel per
  # request is slow enough to blow the 15s timeout under concurrent load —
  # reliability dropped (3/12 vs 7/10). Reused warm tunnels are faster; we lean
  # on US-geo (~2/3 clean on first connect) instead of per-retry rotation.
  pool_maxsize: 20
  verify: false
  proxies:
    all://:
      # PROXY_URL MUST geo-target US — the EU residential pool is broadly
      # /sorry/-blocked by Google, US is mostly clean. Evomi format appends
      # params to the PASSWORD, e.g.
      #   http://user:PASS_country-US@core-residential.evomi.com:1000
      # Keep it ROTATING (no _session-…): a sticky IP that lands on a burned
      # one stays burned for the whole session.
      - ${PROXY_URL}

# Engine roster. Measured 2026-08-12 against this deployment — an engine that
# cannot answer is not free: `outgoing.request_timeout` is 15s, and a single
# engine that hangs for the full 15s sets the floor for the WHOLE response
# (SearXNG waits for its slowest engine). duckduckgo did exactly that on every
# query, pushing every response to ~15.13s and starving the client. Dropping it
# took the same queries to 0.7–1.5s.
#
# Keep this list to engines that actually return. Re-enable one only after
# re-measuring, and check what it does to p99 latency, not just whether it works.
engines:
  # google fails fast (~0.5s, CAPTCHA) rather than hanging, so it costs almost
  # nothing to leave armed and it recovers on its own when the proxy pool
  # rotates onto clean exits. It was returning 0 results at last measurement —
  # see google_sorry_fix.py and the outgoing.proxies note above.
  - name: google
    engine: google
    shortcut: g
    use_mobile_ui: false
    disabled: false
    # The image's defaults mark google `inactive: true` (2026.9.30), and an
    # inactive engine is never registered: `engines=google` then names nothing,
    # and SearXNG silently answers from its default engines instead (Bing, which
    # ignores `site:`). Every "google" search ran on Bing from the 2026-10-02 pin
    # until this line, and LinkedIn people search collapsed with it.
    inactive: false

  - name: brave
    engine: brave
    shortcut: b
    use_mobile_ui: false
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: w
    use_mobile_ui: false
    disabled: false

  # ── Disabled: measured dead, and each one taxes every query ──────────
  # Always timed out (the full 15s), which alone set the response floor at
  # ~15.13s and made every web_search call abort client-side.
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    use_mobile_ui: false
    disabled: true

  # "access denied" on every query.
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true

  # CAPTCHA on every query (startpage redirects to /sp/captcha). Present in
  # SearXNG's defaults, so it needs an explicit disable to stay out.
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true

  # "access denied" on every query. Also from the defaults.
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true
