name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  scrapling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pure-function tests: Scrapling itself is stubbed, so only the web
      # framework pins from requirements.txt are needed (no browser).
      - run: python -m pip install fastapi==0.121.1 httpx==0.28.1
      - run: python -m unittest discover -s services/scrapling -p 'test_*.py' -v
      - run: python -m py_compile services/searxng/google_sorry_fix.py
