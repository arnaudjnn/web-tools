name: Browser forms
on:
  push:
    branches: [main]
    paths: ['services/camoufox/**', 'packages/**', '.github/workflows/forms.yml']
  pull_request:
    paths: ['services/camoufox/**', 'packages/**', '.github/workflows/forms.yml']
jobs:
  camoufox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t web-tools-camoufox services/camoufox
      # Test the actual Linux browser/image, not only a Chromium substitute.
      # Bounded, with one retry: a camoufox launch that never returns hung this
      # job past 40 minutes repeatedly (observed from 2026-09-29). A hang is a
      # failed test, not an hour of billable runner time.
      - run: |
          for try in 1 2; do
            timeout 600 docker run --rm -e FORM_BROWSER_TEST=camoufox \
              -v "$PWD/services/camoufox/test_form_browser.py:/app/test_form_browser.py:ro" \
              web-tools-camoufox python -m unittest -v test_form_browser && exit 0
          done
          exit 1
  forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: FORM_BROWSER_TEST=chromium python -m unittest discover -s services/camoufox -p 'test_form*.py' -v
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # API/CLI resolve toolkit's emitted declarations on a clean checkout.
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm typecheck
